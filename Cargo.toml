[package]
name = "tiny-poe2smoother"
version = "0.6.1"
edition = "2021"
default-run = "tiny-poe2smoother"

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
byteorder = "1.5.0"
dirs = "6.0.0"
memmap2 = "0.9.11"
regex = "1.13.1"
rayon = "1.12"
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3.27"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
rfd = { version = "0.17.2", default-features = false }

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
rfd = "0.17.2"

[build-dependencies]
cc = { version = "1.4.4", features = ["parallel"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = "z"

[profile.release.package.memmap2]
opt-level = 3

[profile.release.package.rayon]
opt-level = 3

[profile.release.package.rayon-core]
opt-level = 3

[profile.release.package.crossbeam-deque]
opt-level = 3

[profile.release.package.crossbeam-epoch]
opt-level = 3

[profile.release.package.crossbeam-utils]
opt-level = 3

[profile.release.package.byteorder]
opt-level = 3

[profile.release.package.regex]
opt-level = 3

[profile.release.package.regex-automata]
opt-level = 3

[profile.release.package.aho-corasick]
opt-level = 3

[profile.release.package.memchr]
opt-level = 3
