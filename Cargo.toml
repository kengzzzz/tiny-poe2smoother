[package]
name = "tiny-poe2smoother"
version = "0.4.1"
edition = "2021"
default-run = "tiny-poe2smoother"

[dependencies]
aho-corasick = "1.1"
anyhow = "1.0"
byteorder = "1.5"
dirs = "6.0"
memmap2 = "0.9"
regex = "1.11"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
sysinfo = "0.37"
tempfile = "3.23"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
rfd = { version = "0.17", default-features = false }

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.35", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
rfd = "0.17"

[build-dependencies]
cc = { version = "1", features = ["parallel"] }

[dev-dependencies]
assert_cmd = "2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = "z"

[profile.release.package.memmap2]
opt-level = 3

[profile.release.package.rayon]
opt-level = 3

[profile.release.package.rayon-core]
opt-level = 3

[profile.release.package.crossbeam-deque]
opt-level = 3

[profile.release.package.crossbeam-epoch]
opt-level = 3

[profile.release.package.crossbeam-utils]
opt-level = 3

[profile.release.package.byteorder]
opt-level = 3

[profile.release.package.regex]
opt-level = 3

[profile.release.package.regex-automata]
opt-level = 3

[profile.release.package.aho-corasick]
opt-level = 3

[profile.release.package.memchr]
opt-level = 3

