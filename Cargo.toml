[package]
name = "tiny-poe2smoother"
version = "0.3.0"
edition = "2021"
default-run = "tiny-poe2smoother"

[dependencies]
anyhow = "1.0"
byteorder = "1.5"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
eframe = { version = "0.33", features = ["persistence"] }
poe_bundle = "0.1.5"
regex = "1.11"
rayon = "1.10"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
sysinfo = "0.37"
tempfile = "3.23"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
