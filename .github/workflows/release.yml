name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        target:
          - name: linux-x86_64
            docker-target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            docker-target: x86_64-pc-windows-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: TARGET=${{ matrix.target.docker-target }}
          outputs: type=local,dest=/tmp/artifacts/${{ matrix.target.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Prepare Linux artifacts
        if: matrix.target.name == 'linux-x86_64'
        run: |
          artifact_dir="/tmp/artifacts/${{ matrix.target.name }}"
          if [ ! -d "$artifact_dir" ]; then
            echo "Expected Linux artifact directory $artifact_dir" >&2
            ls -laR /tmp/artifacts 2>/dev/null || true
            exit 1
          fi
          cd "$artifact_dir"
          rm -f provenance.json
          ls -la
          if [ ! -f poe2smoother-linux-x86_64.tar.gz ]; then
            echo "Expected poe2smoother-linux-x86_64.tar.gz in Linux artifact output" >&2
            exit 1
          fi
          artifact_count="$(find . -maxdepth 1 -type f -printf '.' | wc -c)"
          if [ "$artifact_count" -ne 1 ]; then
            echo "Expected exactly one Linux release artifact, found $artifact_count:" >&2
            find . -maxdepth 1 -type f -printf '%f\n' >&2
            exit 1
          fi

      - name: Prepare Windows artifacts
        if: matrix.target.name == 'windows-x86_64'
        run: |
          artifact_dir="/tmp/artifacts/${{ matrix.target.name }}"
          if [ ! -d "$artifact_dir" ]; then
            echo "Expected Windows artifact directory $artifact_dir" >&2
            ls -laR /tmp/artifacts 2>/dev/null || true
            exit 1
          fi
          cd "$artifact_dir"
          rm -f provenance.json
          ls -la
          if [ ! -f poe2smoother-windows-x86_64.exe ]; then
            echo "Expected poe2smoother-windows-x86_64.exe in Windows artifact output" >&2
            exit 1
          fi
          artifact_count="$(find . -maxdepth 1 -type f -printf '.' | wc -c)"
          if [ "$artifact_count" -ne 1 ]; then
            echo "Expected exactly one Windows release artifact, found $artifact_count:" >&2
            find . -maxdepth 1 -type f -printf '%f\n' >&2
            exit 1
          fi

      - name: List artifacts
        run: ls -laR /tmp/artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poe2smoother-${{ matrix.target.name }}
          path: /tmp/artifacts/${{ matrix.target.name }}/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/release-artifacts
          pattern: poe2smoother-*
          merge-multiple: true

      - name: List release files
        run: ls -la /tmp/release-artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/release-artifacts/*
          generate_release_notes: true
